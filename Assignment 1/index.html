<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Gen I - Pikachu</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="pokemon-card">

        <div class="bg-split">
            <div class="left-panel"></div>
            <div class="right-panel"></div>
        </div>

        <div class="pokeball-watermark"></div>

        <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/International_Pok%C3%A9mon_logo.svg" alt="Pokémon"
            class="logo">

        <div class="menu-btn">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="content-box">
            <p class="subtitle">P O K É M O N &nbsp; G E N &nbsp; I</p>
            <h1 class="title">Pikachu</h1>
            <p class="description">
                Pikachu is an Electric-type Pokémon introduced in Generation I. Pikachu are small, chubby, and
                incredibly cute mouse-like Pokémon. They are almost completely covered by yellow fur.
            </p>
            <div class="pagination">
                <span class="line"></span>
                <span class="numbers">01 / 08</span>
            </div>
        </div>

        <img src="img/pikachu-Photoroom.png" alt="Pikachu" class="pikachu-img">

        <div class="side-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

    </div>

</body>

</html>
