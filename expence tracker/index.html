<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpendWise | Premium SaaS Expense & Budget Tracker</title>
    
    <!-- Meta tags for SEO -->
    <meta name="description" content="Take control of your finances with SpendWise, an industry-grade personal expense dashboard, category budgeting, and deep analytics platform." />
    <meta name="keywords" content="expense tracker, budget, finance, personal finance dashboard, budget planner, react expense tracker" />
    <meta name="author" content="SpendWise Dev Team" />

    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Anti-Flash Theme Checker Script -->
    <script>
      (function() {
        try {
          const session = JSON.parse(localStorage.getItem('expense_tracker_session'));
          const theme = session?.settings?.theme || 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          console.error('Error applying theme early:', e);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-300 font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
