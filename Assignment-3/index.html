<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game - Watch Now</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-icons/6.4.0/css/all.min.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <span class="logo-text">SQUID<br><span class="logo-sub">GAME</span></span>
        </div>
        <nav class="nav-links">
            <a href="#">About</a>
            <a href="#" class="active">Watch now</a>
            <a href="#">Actors</a>
            <a href="#">Contact</a>
        </nav>
        <div class="menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <main class="hero-container">
        <div class="background-text">SQUID GAME</div>

        <div class="content-left">
            <div class="title-wrapper">
                <h1 class="main-title">SQUID<br>GAME</h1>
                <span class="sparkle cyan">✦</span>
                <span class="sparkle yellow">✦</span>
            </div>

            <p class="meta-info">Action / Thriller / Drama Series directed by Dong-hyuk Hwang</p>
            <p class="season-info">Season 1: 9 Episodes</p>

            <div class="cta-group">
                <button class="btn btn-primary">
                    <span class="play-icon">▶</span> Play Now
                </button>
                <button class="btn btn-secondary">
                    <span class="outline-play">▷</span> Watch Trailer
                </button>
            </div>
        </div>

        <div class="scroll-indicator">
            <span class="scroll-text">SCROLL</span>
            <span class="scroll-line"></span>
        </div>

        <div class="character-image-wrapper">
            <img src="https://sm.ign.com/ign_in/video/f/fortnite-x/fortnite-x-squid-game-official-pink-guard-gets-the-w-short-t_x8cy.jpg"
                alt="Guard" class="main-character">
        </div>

        <div class="social-sidebar">
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-facebook-f"></i></a>
        </div>
    </main>

    <footer class="episodes-panel">
        <div class="carousel-container">
            <div class="card">
                <img src="https://i.ytimg.com/vi/fpja04xpR6E/maxresdefault.jpg"
                    alt="Episode 1">
                <div class="play-overlay">▶</div>
            </div>
            <div class="card">
                <img src="https://i.ytimg.com/vi/q_L3nvn_L90/mqdefault.jpg"
                    alt="Episode 2">
                <div class="play-overlay">▶</div>
            </div>
            <div class="card">
                <img src="https://i.ytimg.com/vi/-c7QYzEiibU/hqdefault.jpg"
                    alt="Episode 3">
                <div class="play-overlay">▶</div>
            </div>
        </div>
    </footer>

</body>

</html>
